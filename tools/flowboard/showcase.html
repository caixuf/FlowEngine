<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowEngine · 综合 3D 场景展示</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: #0d1117; color: #c9d1d9;
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
  }
  /* ── 左侧场景列表 ── */
  #sidebar {
    width: 260px; flex: 0 0 260px; height: 100vh;
    background: #161b22; border-right: 1px solid #21262d;
    display: flex; flex-direction: column;
  }
  #sidebar h1 {
    font-size: 15px; margin: 0; padding: 14px 16px;
    color: #58a6ff; border-bottom: 1px solid #21262d;
  }
  #sidebar h1 small { display: block; color: #8b949e; font-size: 11px; font-weight: 400; margin-top: 2px; }
  #scene-list { flex: 1; overflow-y: auto; padding: 8px; }
  .scene-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 9px 10px; margin: 0 0 4px; border: 1px solid transparent;
    border-radius: 6px; background: transparent; color: #c9d1d9;
    font: inherit; text-align: left; cursor: pointer;
  }
  .scene-item:hover { background: #1f2630; }
  .scene-item.active { background: #1f6feb33; border-color: #1f6feb; color: #fff; }
  .scene-idx { color: #6e7681; font-variant-numeric: tabular-nums; font-size: 11px; }
  .scene-item.active .scene-idx { color: #58a6ff; }
  .scene-name { flex: 1; }
  .disabled-scene .scene-name { color: #8b949e; }
  /* ── 主区 ── */
  #main { flex: 1; position: relative; height: 100vh; }
  #scene3d-canvas { display: block; width: 100%; height: 100%; }
  #topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    padding: 12px 16px; background: linear-gradient(#0d1117cc, #0d111700);
    pointer-events: none;
  }
  #scene-title { font-size: 18px; font-weight: 600; color: #fff; }
  #scene-desc { color: #c9d1d9; margin-top: 2px; max-width: 60ch; }
  #scene-meta { color: #8b949e; margin-top: 4px; font-size: 12px; }
  #controls {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    z-index: 5; display: flex; gap: 6px;
    background: #161b22cc; padding: 6px; border-radius: 8px; border: 1px solid #21262d;
  }
  .cam-btn {
    padding: 6px 12px; border: 1px solid #30363d; border-radius: 6px;
    background: #21262d; color: #c9d1d9; font: inherit; cursor: pointer;
  }
  .cam-btn:hover { background: #2d333b; }
  .cam-btn.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  #showcase-msg {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 6; background: #161b22ee; color: #c9d1d9;
    padding: 12px 18px; border-radius: 8px; border: 1px solid #30363d; max-width: 70ch;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "/tools/flowboard/vendor/three/three.module.js",
    "three/addons/": "/tools/flowboard/vendor/three/jsm/"
  }
}
</script>
</head>
<body>
  <aside id="sidebar">
    <h1>综合 3D 场景展示<small>FlowEngine scenario gallery</small></h1>
    <div id="scene-list"></div>
  </aside>
  <div id="main">
    <canvas id="scene3d-canvas"></canvas>
    <div id="topbar">
      <div id="scene-title">加载中…</div>
      <div id="scene-desc"></div>
      <div id="scene-meta"></div>
    </div>
    <div id="controls">
      <button class="cam-btn active" data-cam="chase">追尾</button>
      <button class="cam-btn" data-cam="orbit">环绕</button>
      <button class="cam-btn" data-cam="top">俯视</button>
      <button class="cam-btn" data-cam="driver">驾驶</button>
      <button class="cam-btn" data-cam="front">前视</button>
    </div>
    <div id="showcase-msg"></div>
  </div>
  <script type="module" src="/tools/flowboard/js/showcase/main.js?v=20260806"></script>
</body>
</html>
